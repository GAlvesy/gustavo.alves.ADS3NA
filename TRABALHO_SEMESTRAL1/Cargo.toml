[package]
name = "site_livros_mysql"
version = "0.1.0"
edition = "2021"


[dependencies]
axum = "0.7"  # Ensure version 0.7+
tokio = { version = "1.0", features = ["full"] }

sqlx = { version = "0.7", features = ["mysql", "runtime-tokio-native-tls"] }
serde = { version = "1", features = ["derive"] }
tower = "0.4"
html-escape = "0.2.13"

futures = "0.3"
